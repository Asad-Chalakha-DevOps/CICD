name: Base64-DevSecOps

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - uses: actions/checkout@v3

      ##############################################
      # 1. SECRET SCANNING (GitLeaks)
      ##############################################
      - name: Secrets Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: ""
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ##############################################
      # 2. SAST (STATIC CODE ANALYSIS — SEMGREP)
      ##############################################
      - name: SAST Scan (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/ci"

      ##############################################
      # 3. DEPENDENCY SCAN (NODE)
      ##############################################
      - name: Install Dependencies
        run: npm install

      - name: NPM Audit
        run: npm audit --audit-level=high

      ##############################################
      # 4. BUILD DOCKER IMAGE
      ##############################################
      # Free space
      - name: Free Disk
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
      
      

      - name: Build Docker Image
        run: docker build -t asadchalakha/cicd-demo .
        # Check image exists
      - name: Debug Images
        run: docker images


      ##############################################
      # 5. DOCKER IMAGE VULNERABILITY SCAN — TRIVY
      ##############################################
      # ------------------------------
      # Install Trivy (official repo)
      # ------------------------------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # ------------------------------
      # Trivy Image Scan
      # ------------------------------
      - name: Trivy Secret Scan Only
        run: trivy fs --scanners secret --exit-code 1 .

      ##############################################
      # 6. LOGIN TO DOCKER HUB
      ##############################################
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_PWD }}" | docker login -u "${{ secrets.DOCKER_HUB_USER }}" --password-stdin

      ##############################################
      # 7. PUSH IMAGE
      ##############################################
      - name: Push Docker Image
        run: docker push asadchalakha/cicd-demo:latest

      ##############################################
      # 8. DEPLOY TO EC2 USING BASE64 ENV
      ##############################################
      - name: SSH to EC2 & Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}

          script: |
            echo "➡ Removing old container"
            docker rm -f cicd-demo || true

            echo "➡ Removing old image"
            docker rmi asadchalakha/cicd-demo:latest || true

            echo "➡ Pulling latest image"
            docker pull asadchalakha/cicd-demo:latest

            echo "➡ Decoding ENV_FILE_BASE64 into /tmp/.env"
            echo "${{ secrets.ENV_FILE_BASE64 }}" | base64 --decode > /tmp/envfile

            echo "➡ Starting Container"
            docker run -d \
              --name cicd-demo \
              --restart always \
              --env-file /tmp/envfile \
              -p 3004:3004 \
              asadchalakha/cicd-demo:latest

            echo "➡ Cleaning TEMP"
            rm -f /tmp/envfile

            echo "🎉 Deployment Completed Successfully"
