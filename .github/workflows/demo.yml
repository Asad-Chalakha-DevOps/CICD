name: Secrets-demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: demo   # loads secrets from GitHub Environment "demo"

    steps:
      - uses: actions/checkout@v3

      # ------------------------------
      # Build Docker Image
      # ------------------------------
      - name: Build Docker Image
        run: docker build -t asadchalakha/cicd-demo .

      # ------------------------------
      # Login to Docker Hub
      # ------------------------------
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_PWD }}" | docker login -u "${{ secrets.DOCKER_HUB_USER }}" --password-stdin

      # ------------------------------
      # Push Docker Image
      # ------------------------------
      - name: Push Docker Image
        run: docker push asadchalakha/cicd-demo:latest

      # ------------------------------
      # Deploy to EC2 (Full secret injection)
      # ------------------------------
      - name: SSH to EC2 & deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "➡ Removing old container"
            docker rm -f cicd-demo || true

            echo "➡ Removing old image"
            docker rmi asadchalakha/cicd-demo:latest || true

            echo "➡ Pulling latest image"
            docker pull asadchalakha/cicd-demo:latest

            echo "➡ Creating secrets.json"
            echo '${{ toJson(secrets) }}' > secrets.json

            echo "➡ Cleaning secrets (removing whitespace/newlines)"
            jq -r '
              to_entries
              | .[]
              | .value |= (
                  tostring
                  | gsub("\\n";"")
                  | gsub(" "; "")
                  | gsub("\t"; "")
                )
              | "\(.key)=\(.value)"
            ' secrets.json > /tmp/envfile

            echo "➡ Running container with envfile"
            docker run -d \
              --name cicd-demo \
              --restart always \
              --env-file /tmp/envfile \
              -p 3004:3004 \
              asadchalakha/cicd-demo:latest

            echo "🎉 Deployment completed successfully"
