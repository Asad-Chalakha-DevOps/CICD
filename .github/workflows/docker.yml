name: Manual Deploy to EC2 (Secrets Manager)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub (secure way)
      - name: Login to Docker Hub
        run: docker login --username ${{ secrets.DOCKER_HUB_USER }} --password ${{ secrets.DOCKER_HUB_PWD }}

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t asadchalakha/myapp:latest .

      # 4️⃣ Push Docker image
      - name: Push Docker image
        run: |
          docker push asadchalakha/myapp:latest

      # 5️⃣ Deploy to EC2 via SSH
      - name: Deploy on EC2 (Secrets Manager Runtime Injection)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "Pulling latest image"
            docker pull asadchalakha/myapp:latest

            echo "Stopping old container"
            docker stop myapp || true
            docker rm myapp || true

            echo "Starting container with secrets from AWS Secrets Manager"
            docker run -d \
              --name myapp \
              --restart always \
              -p 3000:3000 \
              $(./fetch-secrets.sh | sed 's/^/-e /') \
              asadchalakha/myapp:latest
