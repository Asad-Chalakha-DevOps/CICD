name: Base64-DevSecOps-Secret-Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - uses: actions/checkout@v3

      #############################################
      # 1. SECRET SCAN — GITLEAKS
      ##############################################
      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ##############################################
      # 2. SECRET SCAN — TRIVY (FILE SYSTEM ONLY)
      ##############################################
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Trivy Secret Scan (Repo Only)
        run: trivy fs --scanners secret --exit-code 1 .

      ##############################################
      # 3. FREE DISK + BUILD DOCKER IMAGE
      ##############################################
      - name: Free Disk
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af

      - name: Build Docker Image
        run: docker build -t asadchalakha/cicd-demo .

      ##############################################
      # 4. LOGIN TO DOCKER HUB
      ##############################################
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_PWD }}" \
          | docker login -u "${{ secrets.DOCKER_HUB_USER }}" --password-stdin

      ##############################################
      # 5. PUSH DOCKER IMAGE
      ##############################################
      - name: Push Docker Image
        run: docker push asadchalakha/cicd-demo:latest

      ##############################################
      # 6. DEPLOY TO EC2 USING BASE64 SECURE ENV FILE
      ##############################################
      - name: SSH to EC2 & Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}

          script: |
            echo "➡ Removing old container"
            docker rm -f cicd-demo || true

            echo "➡ Removing old image"
            docker rmi asadchalakha/cicd-demo:latest || true

            echo "➡ Pulling latest image"
            docker pull asadchalakha/cicd-demo:latest

            echo "➡ Decoding ENV_FILE_BASE64 into /tmp/envfile"
            echo "${{ secrets.ENV_FILE_BASE64 }}" | base64 --decode > /tmp/envfile

            echo "➡ Starting Container"
            docker run -d \
              --name cicd-demo \
              --restart always \
              --env-file /tmp/envfile \
              -p 3004:3004 \
              asadchalakha/cicd-demo:latest

            echo "➡ Cleaning TEMP"
            rm -f /tmp/envfile

            echo "🎉 Deployment Completed Successfully"
